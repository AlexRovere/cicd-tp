name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: {}

jobs: 
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps: 
      # checkout repo
      - uses: actions/checkout@v5

      # install node depuis .nvmrc
      - uses: actions/setup-node@v6 
        with:
          node-version-file: ".nvmrc"
          
      # installer les dépendances 
      - name: Install Dependencies
        run: npm ci

      # installer les navigateurs Playwright
      - name: Install Playwright Browsers
        run: npx playwright install

      # lancer les tests unitaires
      - name: Run Unit Tests
        run: npm test

      # uploader les résultats des tests
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
      
      # vérifier la qualité du code
      - name: Run Linting / Quality Check
        run: npm run lint
        
  report:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Download test results for ${{ matrix.os }}
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results-${{ matrix.os }}
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: List downloaded files
        run: ls -laR test-results-${{ matrix.os }}

      - name: Publish Test Report for ${{ matrix.os }}
        uses: dorny/test-reporter@v1
        with:
          name: Test Results - ${{ matrix.os }}
          path: 'test-results-${{ matrix.os }}/**/junit.xml'
          reporter: 'java-junit'
          fail-on-error: false
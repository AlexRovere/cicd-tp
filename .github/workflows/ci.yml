name: CI
on: [push, pull_request]
  branches: master

jobs: 
  setup:
    runs-on: ubuntu-latest
    steps: 
      # checkout repo
      - uses: actions/checkout@v5

      # install node depuis .nvmrc
      - uses: actions/setup-node@v6 
        with:
          node-version-file: ".nvmrc"
  # installer les dépendances 
  dependencies: 
    needs: setup
    runs-on: ubuntu-latest
    steps:
      run: npm ci

  # lancer les tests unitaires
  test: 
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      -run: npm test
  
  # vérifier la qualité du code
  quality:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: npm run lint